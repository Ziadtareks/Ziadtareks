name: Refresh profile cards

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Render cards from public GitHub data
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/render_readme_cards.py
      - name: Commit refreshed cards
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md cards/ data/contributions.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh profile cards"
            git push
          fi
